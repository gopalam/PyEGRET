# Runs the test suite and the style check on every push and pull request,
# on Linux and Windows, for the oldest and newest supported Python versions.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib pytest rdata
      - name: Style rules (no classes, no chained calls, imports without installing)
        run: python diagnostics/check_style.py
      - name: Tests
        run: python -m pytest -q

  tutorials:
    # Runs every tutorial notebook, so they cannot quietly stop working.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib nbclient nbformat ipykernel
      - name: Run the tutorials
        run: python diagnostics/run_tutorials.py --offline

  usgs:
    # Runs the tutorials that download from USGS. A failure here may only mean
    # the service was busy or has changed, so it does not fail the workflow;
    # check the log when it is red.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib nbclient nbformat ipykernel dataretrieval
      - name: Run the USGS tutorials
        run: python diagnostics/run_tutorials.py --internet
